[project]
name = "arknights-agent"
version = "0.23.0"
description = "Versioned and evidence-backed Arknights knowledge foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "cryptography>=46,<49",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2==3.1.6",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pywin32>=311,<313 ; sys_platform == 'win32'",
  "sqlalchemy>=2.0,<2.1",
  "tokenizers>=0.21,<0.23",
  "uvicorn>=0.30,<1",
]

[project.scripts]
ark = "arknights_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a dedicated PostgreSQL test database", "live: explicitly enabled real-source network integration"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

